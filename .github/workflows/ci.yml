name: CI

# The 20 test files under server/test/ ran on nobody's machine but the
# author's until this existed. `npm test` is `node --test test/*.test.js` —
# no framework, no config, so there is nothing here but install and run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Pinned to the version the module is developed on. A green check against
    # a Node the author never runs proves less than nothing.
    strategy:
      matrix:
        node: ['22', '24']
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci
        working-directory: server

      - name: Test
        run: npm test
        working-directory: server

      # module/ ships as-is to Foundry (no build step), so the only thing that
      # can be statically wrong is a syntax error in a file Foundry will load.
      - name: Parse-check the module sources
        run: |
          for f in module/scripts/*.js module/lib/audit.js; do
            node --check "$f" || exit 1
          done

      # build-info.js carries a hash of module/ that the server compares with
      # each bridge's, so a stale stamp in git would mark every install stale.
      - name: Module content stamp is current
        run: node scripts/stamp-module.mjs --check

      - name: Manifests are valid JSON and agree on the version
        run: |
          MODULE_VERSION=$(jq -r .version module/module.json)
          SERVER_VERSION=$(jq -r .version server/package.json)
          PLUGIN_VERSION=$(jq -r .version plugins/foundry-mcp-live/.claude-plugin/plugin.json)
          jq empty .claude-plugin/marketplace.json plugins/foundry-mcp-live/.mcp.json
          echo "module.json: $MODULE_VERSION / server package.json: $SERVER_VERSION / plugin.json: $PLUGIN_VERSION"
          if [ "$MODULE_VERSION" != "$SERVER_VERSION" ] || [ "$PLUGIN_VERSION" != "$SERVER_VERSION" ]; then
            echo "::error::module.json ($MODULE_VERSION), server/package.json ($SERVER_VERSION) and the Claude Code plugin.json ($PLUGIN_VERSION) disagree"
            exit 1
          fi
